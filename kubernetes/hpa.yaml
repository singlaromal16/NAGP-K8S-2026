apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
 name: node-app-hpa
spec: 
 scaleTargetRef:
  apiVersion: apps/v1
  kind: deployment
  name: node-app-deployment

 minReplicas: 4
 maxReplicas: 10

 metrics:
 - type: Resource
   resource:
    name: cpu
    target:
     type: Utilization
     averageUtilization: 50    